{% block content %}
<style>

body{
font-family:'Poppins',sans-serif;
background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
url("https://images.unsplash.com/photo-1487754180451-c456f719a1fc?auto=format&fit=crop&w=1600&q=80");
background-size:cover;
background-position:center;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

/* LOGIN BOX */
.login-box{
background:rgba(255,255,255,0.95);
padding:40px;
border-radius:15px;
width:420px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* TITLE */
.login-title{
font-weight:700;
text-align:center;
margin-bottom:25px;
color:#0d6efd;
}

/* BUTTON */
.btn-custom{
padding:10px 25px;
font-weight:600;
border-radius:30px;
}

/* DEFAULT TEXT */
.default-text{
background:#f8f9fa;
padding:10px;
border-radius:8px;
font-size:14px;
}

</style>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<div class="login-box">

<h2 class="login-title">
Admin Login
</h2>

<form method="POST">

<div class="mb-3">
<label class="form-label">Admin Username</label>
<input type="text" name="username" class="form-control" placeholder="Enter admin username" required>
</div>

<div class="mb-3">
<label class="form-label">Admin Password</label>
<input type="password" name="password" class="form-control" placeholder="Enter admin password" required>
</div>

<div class="text-center mt-3">
<button type="submit" class="btn btn-dark btn-custom">
Admin Login
</button>
</div>

</form>


</div>

{% endblock %}
