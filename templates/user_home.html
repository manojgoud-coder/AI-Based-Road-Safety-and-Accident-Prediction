{% block content %}
<style>

body{
font-family:'Poppins',sans-serif;
margin:0;
background:
linear-gradient(rgba(8,20,40,0.80), rgba(8,20,40,0.80)),
url("https://images.unsplash.com/photo-1590674899484-d5640e854abe?auto=format&fit=crop&w=1600&q=80");
background-size:cover;
background-position:center;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

/* center box */
.user-box{
background:rgba(255,255,255,0.95);
padding:40px;
border-radius:20px;
text-align:center;
width:480px;
box-shadow:0 15px 40px rgba(0,0,0,0.3);
}

.btn-custom{
padding:10px 25px;
border-radius:30px;
font-weight:600;
margin:6px;
border:none;
}

.btn-predict{
background:linear-gradient(135deg,#ffc107,#ff9800);
color:white;
}

.btn-history{
background:linear-gradient(135deg,#212529,#495057);
color:white;
}

.btn-logout{
background:linear-gradient(135deg,#dc3545,#ff5b6b);
color:white;
}

.btn-predict:hover,
.btn-history:hover,
.btn-logout:hover{
color:white;
transform:translateY(-2px);
}

.warning-text{
color:#ff9800;
font-weight:600;
font-size:16px;
}

.system-text{
color:#555;
font-size:15px;
line-height:1.7;
}

</style>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<div class="user-box">

<h2 class="text-primary fw-bold">Welcome, {{ username }}</h2>

<p class="mt-3 system-text">
AI Based Road Safety and Accident Prediction System
</p>

<p class="warning-text">
⚠️ Traffic Danger Detection & Accident Prediction Module
</p>

<div class="mt-4">
    <a href="{{ url_for('predict') }}" class="btn btn-predict btn-custom">
        Prediction
    </a>

    <a href="{{ url_for('prediction_history') }}" class="btn btn-history btn-custom">
        Prediction History
    </a>

    <a href="{{ url_for('logout') }}" class="btn btn-logout btn-custom">
        Logout
    </a>
</div>

</div>

{% endblock %}
